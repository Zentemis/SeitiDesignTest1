<title>Current through the page draft</title>
<style>
/* The Current: flat depth-tint bands like a chart's, dotted banks, comets (drawn by current.js), the magenta
   track with feathered tidal-stream arrows, and token packets. Geometry: shared/ribbon.py + ribbon_svg.py.
   .current.night switches a stretch to the navy palette. */
.cur-b{fill:#3b75a6}
.cur-b.l1{fill-opacity:.07}.cur-b.l2{fill-opacity:.075}
.cur-e{fill:none;stroke:#2c5a85;stroke-opacity:.5;stroke-width:1.2;stroke-dasharray:.4 5.6;stroke-linecap:round}
.cmt{fill:none;stroke:#1f4a74;stroke-width:1.15;stroke-linecap:round;stroke-linejoin:round}
.cur-t{fill:none;stroke:#b0246a;stroke-width:1.25;stroke-opacity:.85}
.tsa{fill:none;stroke:#b0246a;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.tsa-h{fill:none;stroke:#f4f1e8;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.tok{fill:#b0246a}.tok-h{fill:#b0246a;fill-opacity:.16}
.current.night .cur-b{fill:#8dbbe2}
.current.night .cur-b.l1{fill-opacity:.06}.current.night .cur-b.l2{fill-opacity:.065}
.current.night .cur-e{stroke:#a9c8e2;stroke-opacity:.55}
.current.night .cmt{stroke:#dcecf8}
.current.night .cur-t,.current.night .tsa{stroke:#f08ab8}
.current.night .tok,.current.night .tok-h{fill:#f08ab8}
.current.night .tsa-h{stroke:#13233b}
/* Whole-page Current preview: two pictures (hero B, the homepage sections) on a 1440-wide artboard that f.js scales
   to the window, with the live Current over them. Current styles: shared/current.css. */
html,body{margin:0;background:#f4f1e8}
body{overflow-x:hidden}
.board{position:absolute;left:0;top:0;width:1440px;height:5991px;transform-origin:0 0}
.pic{position:absolute;left:0;width:1440px;height:900px;display:block}
.pic.sec{top:900px;height:5091px}
.flow{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.cur-plan{fill:none;stroke:#b0246a;stroke-width:1.3;stroke-dasharray:.4 7;stroke-linecap:round;stroke-opacity:.6}
.current.night .cur-plan{stroke:#f08ab8}
/* the pen is a ring, so it can't be mistaken for the token packets (solid dots) */
.pen .ph{fill:#b0246a;fill-opacity:.12}.pen .pd{fill:#f4f1e8;stroke:#b0246a;stroke-width:2}
.current.night .pen .ph{fill:#f08ab8;fill-opacity:.18}.current.night .pen .pd{fill:#13233b;stroke:#f08ab8}
.arr{transition:opacity .5s}.arr.off{opacity:0}.still .arr{transition:none}
.end-ring{fill:none;stroke:#f08ab8;stroke-width:2;opacity:0;transform-box:fill-box;transform-origin:center}
.end-ring.on{animation:ring 2.4s ease-out infinite}
@keyframes ring{0%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(1.22,1.5)}}
.still .end-ring.on{animation:none;opacity:.8}
@media (prefers-reduced-motion:reduce){.end-ring.on{animation:none;opacity:.8}}

</style>
</head>

        for (let k = 0; k < LV.length; k++) {
          const a = pos(L, tail + TR * k / LV.length), b = k === LV.length - 1 ? hp : pos(L, tail + TR * (k + 1) / LV.length);
          let d = 'M' + f1(a[0]) + ' ' + f1(a[1]);
          for (let i = a[3]; i <= b[2]; i++) d += 'L' + f1(L.p[2 * i]) + ' ' + f1(L.p[2 * i + 1]);
          out[L.g][k].push(d + 'L' + f1(b[0]) + ' ' + f1(b[1]));
        }
      }));
      S.paths.forEach(set => set.forEach((r, gi) => r.forEach((p, k) => p.setAttribute('d', out[gi][k].join('')))));
      const dur = S.C.dur;
      S.toks.forEach(P => P.dots.forEach((es, k) => {
        const p = pos(S.C, (((P.t0 + TOK * (T - GAP * k)) % dur) + dur) % dur);
        es.forEach(e => { e.setAttribute('cx', f1(p[0])); e.setAttribute('cy', f1(p[1])); });
      }));
    });
  }

  if (!sets.length) return;
  window.curFrame = frame;          // lets a preview or a test draw any moment
  if (once) frame(T0);
  else {
    let T = T0, last = performance.now();
    const tick = now => { T += Math.min(.1, (now - last) / 1000) * (window.curBoost || 1); last = now; frame(T); requestAnimationFrame(tick); };
    requestAnimationFrame(tick);
  }
})();
// Flow preview: scales the 1440-wide artboard to the window, plots the magenta course as you read (up to a reading
// line 62% down the window; on load it first lays in the hero's stretch), keeps the comets to the visible band and
// lets scrolling speed the stream up. Tidal-stream arrows appear as the course reaches them, and at the end a
// ring pulses round the closing button.
// ?still (with current.js's ?still=T): no motion; window.flowSet(scrollY) plots the course for that position.
(() => {
  const board = document.querySelector('.board'), W = 1440, H = +board.dataset.h;
  const trks = [...document.querySelectorAll('.flow .cur-t')], pens = [...document.querySelectorAll('.flow .pen')];
  const arrs = [...document.querySelectorAll('.flow .arr')].map(a => [a, +a.dataset.s]);
  const ring = document.querySelector('.end-ring'), t0 = trks[0], L = t0.getTotalLength();
  const N = 900, ys = new Float32Array(N + 1);
  for (let i = 0; i <= N; i++) ys[i] = t0.getPointAtLength(L * i / N).y;
  const sAt = y => { let b = 0; for (let i = 0; i <= N; i++) if (ys[i] <= y) b = i; return L * b / N; };
  const sHero = sAt(900);
  let k = 1;
  const fit = () => { k = innerWidth / W; board.style.transform = 'scale(' + k + ')'; document.body.style.height = Math.ceil(H * k) + 'px'; };
  fit(); addEventListener('resize', fit);
  trks.forEach(p => { p.style.strokeDasharray = L + ' ' + (L + 20); });
  const set = s => {
    trks.forEach(p => { p.style.strokeDashoffset = L - s; });
    const q = t0.getPointAtLength(s);
    pens.forEach(g => g.setAttribute('transform', 'translate(' + q.x.toFixed(1) + ' ' + q.y.toFixed(1) + ')'));
    arrs.forEach(([a, as]) => a.classList.toggle('off', as > s - 2));
    ring.classList.toggle('on', s > L - 6);
  };
  const target = sy => Math.max(sHero, sAt((sy + innerHeight * .62) / k));
  window.flowSet = sy => set(target(sy));
  const still = /[?&]still/.test(location.search), rm = matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (still) document.documentElement.classList.add('still');
  if (still || rm) { set(target(scrollY)); if (!still) addEventListener('scroll', () => set(target(scrollY)), {passive: true}); return; }
  let shown = 0, lastY = scrollY, vel = 0, t = performance.now();
  set(0);
  const tick = now => {
    const dt = Math.min(.1, (now - t) / 1000);
    t = now;
    window.curView = [scrollY / k - 90, (scrollY + innerHeight) / k + 90];
    vel = vel * .9 + Math.abs(scrollY - lastY) / k * .1;
    lastY = scrollY;
    window.curBoost = 1 + Math.min(1.5, vel / 12);
    const tg = target(scrollY);
    shown += (tg - shown) * Math.min(1, dt * (shown < sHero - 1 ? 1.5 : 3.5));
    set(shown);
    requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
})();

</script>
</body>
</html>
